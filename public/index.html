<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>webRTC-meet — Start a meeting</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body class="lobby">
    <main class="card">
      <div class="brand">
        <div class="logo">●</div>
        <h1>webRTC-meet</h1>
      </div>
      <p class="muted">Secure peer-to-peer video calls. No accounts. No tracking.</p>

      <form id="joinForm" autocomplete="off" novalidate>
        <label for="displayName">Your name</label>
        <input id="displayName" name="displayName" maxlength="30" placeholder="e.g. Ada Lovelace" required />

        <label for="room">Room name</label>
        <div class="row">
          <input id="room" name="room" maxlength="40" placeholder="team-standup" required pattern="[a-zA-Z0-9_\-]+" />
          <button type="button" id="genRoom" class="ghost" title="Generate random room">⟳</button>
        </div>
        <small class="hint">Letters, numbers, dashes and underscores only.</small>

        <button type="submit" class="primary">Join meeting →</button>
        <p id="error" class="error" role="alert" aria-live="polite"></p>
      </form>
    </main>
    <footer class="footer">© webRTC-meet · End-to-end peer connection</footer>
    <script src="/js/lobby.js" type="module"></script>
  </body>
</html>
